name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # Ensure line endings are correct
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Google Container Registry
        uses: docker/login-action@v2
        with:
          registry: eu.gcr.io
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          tags: |
            eu.gcr.io/wisebid/docling-inference:${{ github.sha }}
            eu.gcr.io/wisebid/docling-inference:latest
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=3.11
            PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu

      - name: Deploy to Cloud Run
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud run deploy docling-inference-dev \
            --image eu.gcr.io/wisebid/docling-inference:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 4Gi
